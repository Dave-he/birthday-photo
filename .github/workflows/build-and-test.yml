name: Monorepo Build and Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.27.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: |
          # Install deps in web
          pnpm --dir apps/web install --no-frozen-lockfile
          # Install deps in admin
          pnpm --dir apps/admin install --no-frozen-lockfile

      - name: Build Web App (Next.js)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NODE_ENV: production
        run: |
          pnpm --dir apps/web build

      - name: Build Admin App (Refine)
        env:
          VITE_SUPABASE_URL: https://placeholder-project.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_WEB_URL: http://localhost:3000
        run: |
          pnpm --dir apps/admin build
